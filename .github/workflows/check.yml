name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.24'
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv lock --check
      - run: uv run --locked pytest -q
      - run: uv run --locked ruff check src/btc5m tests
      - run: uv run --locked ruff format --check src/btc5m tests
      - run: uv run --locked mypy src/btc5m
