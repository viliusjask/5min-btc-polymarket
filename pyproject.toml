[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "btc5m"
version = "0.1.0"
description = "Settlement-aware BTC five-minute trading experiment with durable execution accounting"
requires-python = ">=3.12"
dependencies = [
  "polymarket-client==0.9.0",
  "httpx==0.28.1",
  "eth-account==0.13.7",
  "eth-abi==5.2.0",
  "eth-utils==5.3.1",
]

[project.scripts]
btc5m = "btc5m.cli:main"

[dependency-groups]
dev = ["pytest==9.0.3", "ruff==0.12.12", "mypy==1.18.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/btc5m"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src/btc5m"]
check_untyped_defs = true
warn_unused_ignores = true
